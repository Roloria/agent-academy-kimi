<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <!-- 平铺工程网格：48px 间距，1px 细线，透明底 -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="0.5" x2="192" y2="0.5"/>
    <line x1="0" y1="48.5" x2="192" y2="48.5"/>
    <line x1="0" y1="96.5" x2="192" y2="96.5"/>
    <line x1="0" y1="144.5" x2="192" y2="144.5"/>
    <line x1="0.5" y1="0" x2="0.5" y2="192"/>
    <line x1="48.5" y1="0" x2="48.5" y2="192"/>
    <line x1="96.5" y1="0" x2="96.5" y2="192"/>
    <line x1="144.5" y1="0" x2="144.5" y2="192"/>
  </g>
  <!-- 每 4 格一个十字准星点（四角拼接成完整十字，保证无缝平铺） -->
  <g stroke="#334155" stroke-width="1">
    <line x1="0" y1="0" x2="6" y2="0"/><line x1="0" y1="0" x2="0" y2="6"/>
    <line x1="192" y1="0" x2="186" y2="0"/><line x1="192" y1="0" x2="192" y2="6"/>
    <line x1="0" y1="192" x2="6" y2="192"/><line x1="0" y1="192" x2="0" y2="186"/>
    <line x1="192" y1="192" x2="186" y2="192"/><line x1="192" y1="192" x2="192" y2="186"/>
  </g>
</svg>
