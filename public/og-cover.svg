<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#070A12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 粒子光点 -->
  <g fill="#38BDF8">
    <circle cx="120" cy="120" r="1.6" opacity="0.55"/>
    <circle cx="320" cy="80" r="1.2" opacity="0.35"/>
    <circle cx="520" cy="150" r="1.8" opacity="0.5"/>
    <circle cx="700" cy="90" r="1.2" opacity="0.3"/>
    <circle cx="210" cy="500" r="1.5" opacity="0.4"/>
    <circle cx="430" cy="560" r="1.2" opacity="0.3"/>
    <circle cx="640" cy="520" r="1.7" opacity="0.45"/>
    <circle cx="80" cy="330" r="1.2" opacity="0.3"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="260" cy="200" r="1.4" opacity="0.4"/>
    <circle cx="590" cy="320" r="1.2" opacity="0.3"/>
    <circle cx="160" cy="580" r="1.5" opacity="0.35"/>
    <circle cx="760" cy="470" r="1.3" opacity="0.3"/>
  </g>

  <!-- 左侧文字 -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="90" y="272" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="4">智能体学院</text>
    <text x="94" y="350" font-size="42" font-weight="700" fill="url(#grad)" letter-spacing="6">Agent Academy</text>
    <text x="94" y="424" font-size="26" font-weight="400" fill="#9AA7BC" letter-spacing="2">从原理到实战，走完 Agent 学习的完整周期</text>
    <rect x="94" y="470" width="72" height="5" rx="2.5" fill="url(#grad)"/>
  </g>

  <!-- 右侧五节点圆环 -->
  <g>
    <circle cx="950" cy="315" r="150" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.55"/>
    <circle cx="950" cy="315" r="150" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.12"/>

    <g filter="url(#glow)">
      <circle cx="950" cy="165" r="11" fill="#38BDF8"/>
      <circle cx="1092.7" cy="268.6" r="11" fill="#FBBF24"/>
      <circle cx="1038.2" cy="436.4" r="11" fill="#A78BFA"/>
      <circle cx="861.8" cy="436.4" r="11" fill="#34D399"/>
      <circle cx="807.3" cy="268.6" r="11" fill="#F472B6"/>
    </g>
    <g fill="#070A12">
      <circle cx="950" cy="165" r="4"/>
      <circle cx="1092.7" cy="268.6" r="4"/>
      <circle cx="1038.2" cy="436.4" r="4"/>
      <circle cx="861.8" cy="436.4" r="4"/>
      <circle cx="807.3" cy="268.6" r="4"/>
    </g>
  </g>
</svg>
