<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" fill="none" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 角标 -->
  <g stroke="#1E293B" stroke-width="1">
    <path d="M40 28 V16 H52"/><path d="M1160 16 H1148 V28"/>
    <path d="M40 532 V544 H52"/><path d="M1160 544 H1148 V532"/>
  </g>
  <text x="52" y="12" fill="#5C6B82" font-size="12" letter-spacing="2">FIG.MCP-02 — INTEGRATIONS: M×N → M+N</text>

  <!-- 中缝虚线 -->
  <line x1="600" y1="36" x2="600" y2="524" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ============ 左半：无标准 M×N ============ -->
  <text x="300" y="66" fill="#F472B6" font-size="15" text-anchor="middle" letter-spacing="2">无标准：M 个应用 × N 个能力</text>

  <!-- 12 条杂乱连线（先画线，盒子在上层） -->
  <g stroke="#F472B6" stroke-width="1" stroke-opacity="0.55">
    <line x1="150" y1="144" x2="105" y2="400"/><line x1="150" y1="144" x2="215" y2="400"/>
    <line x1="150" y1="144" x2="325" y2="400"/><line x1="150" y1="144" x2="435" y2="400"/>
    <line x1="300" y1="144" x2="105" y2="400"/><line x1="300" y1="144" x2="215" y2="400"/>
    <line x1="300" y1="144" x2="325" y2="400"/><line x1="300" y1="144" x2="435" y2="400"/>
    <line x1="450" y1="144" x2="105" y2="400"/><line x1="450" y1="144" x2="215" y2="400"/>
    <line x1="450" y1="144" x2="325" y2="400"/><line x1="450" y1="144" x2="435" y2="400"/>
  </g>

  <!-- 中央计数 -->
  <rect x="215" y="252" width="170" height="52" rx="10" fill="#0D1320" stroke="#F472B6" stroke-opacity="0.5"/>
  <text x="300" y="287" fill="#F472B6" font-size="24" text-anchor="middle" filter="url(#glow)">M×N = 12</text>

  <!-- 左：3 个 App -->
  <g>
    <rect x="100" y="100" width="100" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="150" y="128" fill="#E8EDF5" font-size="13" text-anchor="middle">App 1</text>
    <rect x="250" y="100" width="100" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="300" y="128" fill="#E8EDF5" font-size="13" text-anchor="middle">App 2</text>
    <rect x="400" y="100" width="100" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="128" fill="#E8EDF5" font-size="13" text-anchor="middle">App 3</text>
  </g>
  <!-- 左：4 个工具 -->
  <g>
    <rect x="57" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="105" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">文件系统</text>
    <rect x="167" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="215" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">GitHub</text>
    <rect x="277" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="325" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">数据库</text>
    <rect x="387" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="435" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">Slack</text>
  </g>
  <text x="300" y="496" fill="#5C6B82" font-size="12" text-anchor="middle">每对都要单独写一套适配代码</text>

  <!-- ============ 右半：有了 MCP M+N ============ -->
  <text x="870" y="66" fill="#34D399" font-size="15" text-anchor="middle" letter-spacing="2">有了 MCP：各实现一次即互联</text>

  <!-- 7 条整洁连线 -->
  <g stroke="#34D399" stroke-width="1.5" stroke-opacity="0.8">
    <line x1="730" y1="144" x2="832" y2="237"/>
    <line x1="870" y1="144" x2="870" y2="220"/>
    <line x1="1010" y1="144" x2="908" y2="237"/>
    <line x1="700" y1="400" x2="828" y2="303"/>
    <line x1="813" y1="400" x2="849" y2="320"/>
    <line x1="927" y1="400" x2="891" y2="320"/>
    <line x1="1040" y1="400" x2="912" y2="303"/>
  </g>

  <!-- 中央 MCP 圆环 -->
  <circle cx="870" cy="272" r="48" fill="#0D1320" stroke="#38BDF8" stroke-width="2" filter="url(#glow)"/>
  <circle cx="870" cy="272" r="38" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="870" y="279" fill="#38BDF8" font-size="17" text-anchor="middle" letter-spacing="1">MCP</text>

  <!-- 中央计数 -->
  <rect x="785" y="336" width="170" height="46" rx="10" fill="#0D1320" stroke="#34D399" stroke-opacity="0.5"/>
  <text x="870" y="367" fill="#34D399" font-size="22" text-anchor="middle" filter="url(#glow)">M+N = 7</text>

  <!-- 右：3 个 App -->
  <g>
    <rect x="680" y="100" width="100" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="730" y="128" fill="#E8EDF5" font-size="13" text-anchor="middle">App 1</text>
    <rect x="820" y="100" width="100" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="870" y="128" fill="#E8EDF5" font-size="13" text-anchor="middle">App 2</text>
    <rect x="960" y="100" width="100" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="1010" y="128" fill="#E8EDF5" font-size="13" text-anchor="middle">App 3</text>
  </g>
  <!-- 右：4 个工具 -->
  <g>
    <rect x="652" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="700" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">文件系统</text>
    <rect x="765" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="813" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">GitHub</text>
    <rect x="879" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="927" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">数据库</text>
    <rect x="992" y="400" width="96" height="44" rx="8" fill="#0B0F1A" stroke="#334155" stroke-width="1.5"/>
    <text x="1040" y="428" fill="#E8EDF5" font-size="12.5" text-anchor="middle">Slack</text>
  </g>
  <text x="870" y="496" fill="#5C6B82" font-size="12" text-anchor="middle">Client 实现一次 · Server 实现一次 · 即插即用</text>
</svg>
