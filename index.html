<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 主题防闪烁：React 挂载前读取 localStorage，默认深色（v2-design.md §1.1）
      (function () {
        try {
          var t = localStorage.getItem("aa-theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta name="description" content="Agent Academy 智能体学院——基于公开 GitHub 开源项目、经典论文与互联网知识库，系统学习 AI Agent 的工作原理、主流框架与核心技能，走完完整学习周期，独立交付一个完整 Agent 项目。" />
    <meta property="og:title" content="智能体学院 Agent Academy" />
    <meta property="og:description" content="从原理到实战，走完 Agent 学习的完整周期。" />
    <meta property="og:image" content="/og-cover.svg" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Agent Academy 智能体学院 — AI Agent 完整学习平台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
